version: "3.9"

services:
  server:
    build: ./server
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        REACT_APP_SIGNALING_SERVER: ${REACT_APP_SIGNALING_SERVER:-http://localhost:10000}
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
